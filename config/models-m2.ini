; models-m2.ini — Router-Preset fuer den M2 Mac mini (24 GB RAM, ~16 GB GPU-Budget)
; Start: ./scripts/start-m2.sh  (setzt --models-max 1)

version = 1

[*]
jinja = 1
ctx-size = 32768
n-gpu-layers = 99

[JetBrains/Mellum2-12B-A2.5B-Thinking-GGUF-Q6_K:Q6_K]
hf-repo = JetBrains/Mellum2-12B-A2.5B-Thinking-GGUF-Q6_K:Q6_K
temp = 0.2
top-p = 0.95
reasoning-format = deepseek
reasoning-budget = 8192

[JetBrains/Mellum2-12B-A2.5B-Thinking-GGUF-Q4_K_M:Q4_K_M]
hf-repo = JetBrains/Mellum2-12B-A2.5B-Thinking-GGUF-Q4_K_M:Q4_K_M
temp = 0.2
top-p = 0.95
reasoning-format = deepseek
reasoning-budget = 8192

; Qwen3.6 27B nur Q3_K_S -> nicht 1:1 mit M4 (Q4_K_XL) vergleichbar
[unsloth/Qwen3.6-27B-MTP-GGUF:Q3_K_S]
hf-repo = unsloth/Qwen3.6-27B-MTP-GGUF:Q3_K_S
ctx-size = 16384
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0

; Apertus: NUR jondale, MaziyarPanahi crasht den Router
[jondale/Apertus-8B-Instruct-2509-GGUF:Q4_K_M]
hf-repo = jondale/Apertus-8B-Instruct-2509-GGUF:Q4_K_M
temp = 0.8
top-p = 0.9
