; models.ini — Router-Preset fuer llama.cpp (--models-preset)
; -----------------------------------------------------------
; Pro Modell die korrekten Sampling-Parameter, damit der Vergleich
; im Router fair wird. Schluessel = llama-server-Flags ohne "--".
;
; Start:  llama-server --port 8080 --models-preset /PFAD/models.ini
; Mode B: lokale Config, Rollback = Datei loeschen.
;
; Hinweis: Das INI-Format ist ueber llama.cpp-Versionen nicht voll
; standardisiert. Nach einem llama.cpp-Upgrade kurz testen, ob die
; Datei noch sauber laedt (curl /v1/models zeigt alle Eintraege).

version = 1

; --- Globale Defaults, gelten fuer alle Modelle (pro Modell ueberschreibbar) ---
[*]
jinja = 1
; MCP-Tool-Workflows fuellen den Kontext schnell (Tool-Defs + Ergebnisse).
; 8192 war fuer reinen Chat ok, fuer Agentic zu klein -> 32768.
ctx-size = 32768
n-gpu-layers = 99

; --- Mellum Q6: Coding-Spezialist. Niedrige Temperatur fuer stabile
;     Tool-Calls und reproduzierbare Code-Ausgaben. ---
[JetBrains/Mellum2-12B-A2.5B-Thinking-GGUF-Q6_K:Q6_K]
hf-repo = JetBrains/Mellum2-12B-A2.5B-Thinking-GGUF-Q6_K:Q6_K
temp = 0.2
top-p = 0.95
; Reasoning-Architektur erst seit 2.6.2026 in llama.cpp (PR #23966), noch
; jung. Ohne Budget ist reasoning-budget=-1 (unbegrenzt) der Default -> die
; <think>-Denkkette kann theoretisch den kompletten ctx-size (32768) fuellen,
; bevor je eine sichtbare Antwort/ein Tool-Call kommt. Startwert zum Testen;
; ggf. anhand der [antwort]-Logs (core/mcp_agent.py) nachjustieren.
reasoning-format = deepseek
reasoning-budget = 8192

; --- Mellum Q4: gleiche Rolle, fuer Q4-vs-Q6-Vergleich. ---
[JetBrains/Mellum2-12B-A2.5B-Thinking-GGUF-Q4_K_M:Q4_K_M]
hf-repo = JetBrains/Mellum2-12B-A2.5B-Thinking-GGUF-Q4_K_M:Q4_K_M
temp = 0.2
top-p = 0.95
; s.o. (gleiche Begruendung wie beim Q6-Eintrag)
reasoning-format = deepseek
reasoning-budget = 8192

; --- Qwen3.6 27B: allgemeiner Chat/Reasoning. Qwen-empfohlene Werte
;     fuer Thinking-Mode.
;
;     ctx-size 65536 statt der globalen 32768: In Cline (PhpStorm, Kirby-
;     Projekt) lief schon die ZWEITE Frage in "request (32944 tokens) exceeds
;     the available context size" — Clines Systemprompt + Tool-Defs +
;     Projektkontext + Historie fuellen 32k sofort (24.09.2026).
;     PREIS: der KV-Cache (Zwischenspeicher aller bisherigen Token) liegt im
;     RAM und verdoppelt sich mit. Bei 27B auf 32 GB ist das grenzwertig —
;     wenn macOS anfaengt auszulagern, wird es LANGSAMER statt schneller.
;     Beim ersten laengeren Cline-Lauf den Speicher im Aktivitaetsmonitor
;     beobachten; bei Swapping zurueck auf 32768 und stattdessen mit kurzen,
;     einzelnen Cline-Aufgaben arbeiten. ---
[unsloth/Qwen3.6-27B-MTP-GGUF:Q4_K_XL]
hf-repo = unsloth/Qwen3.6-27B-MTP-GGUF:Q4_K_XL
ctx-size = 65536
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0

