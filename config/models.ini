; --- Qwen3.8 27B (Aug. 2026): Kandidat fuer den High-End-Review (Review-Eval
;     role-split/eval/, 15.10.2026). Gleiche Architektur wie 3.6, staerkeres
;     Post-Training (laut Qwen-Modellkarte v.a. agentisch). UD-Q4_K_XL 17,6 GB,
;     gleiche Quantisierung wie 3.6 -> Modelle vergleichen, nicht Quants.
;     Sampling = unsloth-Empfehlung Thinking-Mode (temp 1.0, top-k 20).
;     Denkt per Default sehr lang ("xhigh"): reasoning-budget als Startwert,
;     damit der Kontext nicht vor dem ersten Tool-Call voll ist. Erster Aufruf
;     laedt die GGUF von Hugging Face (dauert). Mit LAB_MODELS_MAX=1 testen. ---
[unsloth/Qwen3.8-27B-GGUF:Q4_K_XL]
hf-repo = unsloth/Qwen3.8-27B-GGUF:Q4_K_XL
ctx-size = 65536
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
reasoning-budget = 16384

; --- Qwen3.8 27B in Q8_0 (29 GB laut HF, 21.10.2026): Qualitaetskandidat, Luecke in
;     claude/modellwahl-tabelle.md. Frage: Bringt hoehere Praezision im Review mehr
;     Treffer als Q4_K_XL? Alles andere bewusst wie der Q4-Eintrag darueber, damit nur
;     die Quantisierung den Unterschied macht. Speicher: 29 GB Gewichte + KV-Cache bei
;     65K Kontext. Vermutung: passt bei 48 GB nur mit einem Modell im Speicher
;     (start_eval.command); beim ersten Lauf Aktivitaetsmonitor beobachten, bei
;     Auslagerung ctx-size auf 32768 senken (dann Vergleich nur mit gleichem Kontext).
;     Ausweichen, falls zu knapp: UD-Q6_K (22 GB). ---
[unsloth/Qwen3.8-27B-GGUF:Q8_0]
hf-repo = unsloth/Qwen3.8-27B-GGUF:Q8_0
ctx-size = 65536
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0
reasoning-budget = 16384

