;     claude/modellwahl-tabelle.md (21.10.2026). Frage: gleiche Review-Qualitaet wie
;     27B, aber schneller? Bewusst wie der 27B-Eintrag: gleiches Repo-Muster (MTP),
;     gleiche Quantisierung UD-Q4_K_XL (22,9 GB laut HF, 21.10.), gleiche Sampling-Werte
;     und gleicher Kontext -> Modelle vergleichen, nicht Einstellungen. MTP-Beschleunigung
;     (--spec-type draft-mtp) ist wie beim 27B NICHT aktiv. Erster Aufruf laedt von
;     Hugging Face (~23 GB). Mit LAB_MODELS_MAX=1 bzw. start_eval.command testen;
;     Speicher beim ersten Lauf im Aktivitaetsmonitor beobachten. ---
[unsloth/Qwen3.6-35B-A3B-MTP-GGUF:Q4_K_XL]
hf-repo = unsloth/Qwen3.6-35B-A3B-MTP-GGUF:Q4_K_XL
ctx-size = 65536
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0

; --- Gemma 4 26B A4B: allgemeiner Chat, multimodal. Gemma-empfohlene
